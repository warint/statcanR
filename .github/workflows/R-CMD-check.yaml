# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: "release"}
          - {os: windows-latest, r: "release"}
          - {os: ubuntu-latest, r: "devel", http-user-agent: "release"}
          - {os: ubuntu-latest, r: "release"}
          - {os: ubuntu-latest, r: "oldrel-1"}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      # setup-pandoc downloads Pandoc from GitHub's release servers, which
      # occasionally return a transient 502 that outlasts the action's own
      # ~27s of built-in retries and fails the whole job. Make it resilient:
      # try once (non-fatal), wait out the blip, then try again. We check
      # `outcome` rather than `conclusion` because continue-on-error coerces
      # `conclusion` to success, so only `outcome` reports the real failure.
      - uses: r-lib/actions/setup-pandoc@v2
        id: pandoc
        continue-on-error: true
      - name: Wait before retrying Pandoc download
        if: steps.pandoc.outcome == 'failure'
        run: sleep 30
        shell: bash
      - uses: r-lib/actions/setup-pandoc@v2
        if: steps.pandoc.outcome == 'failure'

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Install pak from the regular CRAN repositories rather than the
          # r-lib.github.io pak index. That index intermittently returned
          # "unable to access index" on windows-latest and failed the job
          # before R CMD check could run; CRAN is the same reliable source the
          # rest of the dependency install already uses.
          pak-version: repo
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
